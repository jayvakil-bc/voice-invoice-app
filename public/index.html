<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vix.com - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        :root {
            --primary-color: #4542FF;
            --primary-dark: #3734CC;
            --primary-darker: #2A2799;
            --text-color: #2A2799;
            --light-purple: #EEEEFF;
            --dark-grey: #4a5568;
        }
        
        body {
            margin: 0;
            padding: 0;
        }
        
        .site-name {
            position: fixed;
            top: 2rem;
            left: 2rem;
            font-size: 1.5rem;
            font-weight: 400;
            color: #000000;
            z-index: 1000;
        }
        
        .login-container {
            min-height: 100vh;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            padding: 20px;
            gap: 2rem;
        }
        
        .login-main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .login-box {
            background: #ffffff;
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            width: 340px;
            height: 340px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            text-align: center;
            box-sizing: border-box;
            position: relative;
        }
        
        .login-actions {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            width: 340px;
        }
        
        .login-box p {
            color: var(--dark-grey, #4a5568);
            margin: 0 0 0.5rem 0;
            font-weight: 500;
            font-size: 1.518rem;
        }
        
        .invoice-purple {
            color: var(--primary-color, #4542FF);
        }
        
        .login-box .subtitle {
            color: #9ca3af;
            margin: -0.5rem 0 0 0;
            font-weight: 400;
            font-size: 0.759rem;
            line-height: 1.4;
            text-align: center;
            max-width: 100%;
        }
        
        .mic-section {
            margin: 0;
            position: absolute;
            top: 0;
            left: 0;
            width: 340px;
            height: 340px;
        }
        
        .mic-button {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #e5e7eb;
            background: #ffffff;
            cursor: pointer;
            position: absolute;
            top: 110px;
            left: 110px;
            overflow: visible;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
            z-index: 1;
        }
        
        .mic-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
            color: #6b7280;
            transition: color 0.3s ease;
            width: 100%;
            height: 100%;
        }
        
        .mic-icon svg {
            width: 56px;
            height: 56px;
            stroke: currentColor;
            fill: none;
        }
        
        .mic-button:hover:not(:active):not(.clicked):not(.recording) {
            border-color: #4542FF;
            box-shadow: 0 8px 30px rgba(69, 66, 255, 0.3), 0 0 0 4px rgba(69, 66, 255, 0.1);
        }
        
        .mic-button:active,
        .mic-button.clicked {
            background: #4542FF;
            border-color: #3734CC;
            animation: none;
            transform: scale(0.98);
        }
        
        .mic-button.recording {
            transform: scale(0.98);
        }
        
        .mic-button.recording {
            background: #4542FF;
            border-color: #3734CC;
        }
        
        .mic-button.recording .mic-icon,
        .mic-button.clicked .mic-icon,
        .mic-button:active .mic-icon {
            color: #ffffff;
        }
        
        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            width: 100%;
            padding: 1rem 2rem;
            background: #ffffff;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: var(--dark-grey, #4a5568);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        
        .google-btn:hover {
            border-color: var(--primary-color, #4542FF);
            box-shadow: 0 4px 12px rgba(69, 66, 255, 0.2);
            transform: translateY(-2px);
            color: var(--primary-color, #4542FF);
        }
        
        .google-icon {
            width: 24px;
            height: 24px;
        }
        
        .status {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            margin: 0;
            font-size: 0.9975rem !important;
            color: #9ca3af !important;
            font-weight: 400 !important;
            min-height: 24px;
            text-align: center;
            width: 100%;
            z-index: 2;
        }
        
        #status {
            font-size: 0.9975rem !important;
            color: #9ca3af !important;
            font-weight: 400 !important;
        }
        
        .status.listening {
            color: #ef4444;
            font-weight: 400;
        }
        
        .voice-visualizer {
            position: absolute;
            bottom: 4rem;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 40px;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 3px;
            z-index: 2;
        }
        
        .voice-visualizer.active {
            display: flex;
        }
        
        .voice-bar {
            width: 4px;
            background: #4542FF;
            border-radius: 2px;
            transition: height 0.1s ease;
            min-height: 4px;
        }
        
        /* Preview Panel Styles */
        .preview-panel {
            width: 600px;
            max-width: 50vw;
            height: calc(100vh - 40px);
            max-height: 900px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        
        .preview-panel.active {
            display: flex;
        }
        
        .preview-panel-header {
            padding: 1.5rem;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            flex-shrink: 0;
        }
        
        .preview-panel-header h3 {
            margin: 0;
            color: var(--dark-grey, #4a5568);
            font-size: 1.0625rem;
            font-weight: 400;
        }
        
        .preview-panel-header > div {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
        
        .preview-tabs {
            display: flex;
            gap: 0.5rem;
        }
        
        .preview-tab {
            padding: 0.5rem 1rem;
            background: #f3f4f6;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--dark-grey, #4a5568);
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        
        .preview-tab.active {
            background: var(--primary-color, #4542FF);
            color: #ffffff;
        }
        
        .preview-download-btn {
            padding: 0.5rem 1rem;
            background: var(--primary-color, #4542FF);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            white-space: nowrap;
            height: fit-content;
        }
        
        .preview-download-btn:hover {
            background: var(--primary-dark, #3734CC);
        }
        
        .preview-panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
        }
        
        .preview-content-section {
            display: none;
        }
        
        .preview-content-section.active {
            display: block;
        }
        
        .preview-section {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        .preview-header {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }
        
        .preview-header > div {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .preview-label {
            font-size: 0.765rem;
            color: var(--dark-grey, #4a5568);
            opacity: 0.6;
            font-weight: 400;
        }
        
        .preview-input {
            padding: 0.75rem;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 0.85rem;
            font-family: inherit;
            color: var(--dark-grey, #4a5568);
            background: #ffffff;
            width: 100%;
        }
        
        .preview-input:focus {
            outline: none;
            border-color: var(--primary-color, #4542FF);
        }
        
        .preview-parties {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }
        
        .preview-party {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        
        .preview-party h3 {
            margin: 0;
            font-size: 0.935rem;
            color: var(--dark-grey, #4a5568);
            font-weight: 400;
        }
        
        .preview-items {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .preview-items h3 {
            margin: 0;
            font-size: 0.935rem;
            color: var(--dark-grey, #4a5568);
            font-weight: 400;
        }
        
        .preview-item {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 0.5rem;
            align-items: center;
            padding: 0.75rem;
            background: #f9fafb;
            border-radius: 8px;
        }
        
        .preview-totals {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            padding-top: 1rem;
            border-top: 1px solid #e5e7eb;
        }
        
        .total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }
        
        .total-row span {
            color: var(--dark-grey, #4a5568);
            font-weight: 400;
        }
        
        .total-row.total-final {
            font-size: 1.0625rem;
            font-weight: 400;
            padding-top: 0.5rem;
            border-top: 1px solid #e5e7eb;
            margin-top: 0.5rem;
        }
        
        .preview-notes {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .preview-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem;
            color: var(--dark-grey, #4a5568);
        }
        
        .preview-loading::after {
            content: '';
            width: 40px;
            height: 40px;
            border: 3px solid #e5e7eb;
            border-top-color: var(--primary-color, #4542FF);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-top: 1rem;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

                            <div class="voice-bar"></div>
                            <div class="voice-bar"></div>
                            <div class="voice-bar"></div>
                            <div class="voice-bar"></div>
                            <div class="voice-bar"></div>
                            <div class="voice-bar"></div>
                            <div class="voice-bar"></div>
                            <div class="voice-bar"></div>
                            <div class="voice-bar"></div>
                            <div class="voice-bar"></div>
                            <div class="voice-bar"></div>
                            <div class="voice-bar"></div>
                            <div class="voice-bar"></div>

                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>

    <script>
        let recognition;
        let isRecording = false;
        let transcript = '';
        let recognitionTimeout = null;
        let audioContext = null;
        let analyser = null;
        let microphone = null;
        let animationFrameId = null;
        let voiceVisualizer = null;
        let voiceBars = null;
        
        // Initialize speech recognition
        function initializeSpeechRecognition() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = 'en-US';
                
                console.log('Speech recognition initialized successfully');
                return true;
            } else {
                console.error('Speech recognition not supported in this browser');
                return false;
            }
        }
        
        // Initialize on load
        const speechAvailable = initializeSpeechRecognition();
        
        // Wait for DOM to be ready
        let micBtn, status;
        
        window.addEventListener('DOMContentLoaded', () => {
            micBtn = document.getElementById('micBtn');
            status = document.getElementById('status');
            voiceVisualizer = document.getElementById('voiceVisualizer');
            voiceBars = voiceVisualizer ? voiceVisualizer.querySelectorAll('.voice-bar') : null;
            
            if (!micBtn) {
                console.error('Mic button not found!');
                return;
            }
            
            if (!status) {
                console.error('Status element not found!');
                return;
            }
            
            // Set up mic button click handler
            micBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                // Add clicked class for purple state
                micBtn.classList.add('clicked');
                toggleRecording();
                
                // Remove clicked class after a short delay to allow visual feedback
                setTimeout(() => {
                    if (!isRecording) {
                        micBtn.classList.remove('clicked');
                    }
                }, 200);
            });
            
            console.log('Mic button event listener attached');
            
            // Set up recognition handlers if available
            if (recognition) {
                setupRecognitionHandlers();
            } else {
                console.warn('Recognition not available on DOMContentLoaded, will retry...');
                setTimeout(() => {
                    if (recognition) {
                        setupRecognitionHandlers();
                        console.log('Recognition handlers set up on retry');
                    }
                }, 100);
            }
        });
        
        function toggleRecording() {
            console.log('toggleRecording called, recognition:', recognition, 'isRecording:', isRecording);
            
            if (!recognition) {
                console.error('Recognition not available, attempting to reinitialize...');
                // Try to reinitialize
                if (initializeSpeechRecognition()) {
                    setupRecognitionHandlers();
                    if (status) status.textContent = 'Ready! Click mic again to start recording.';
                    return;
                } else {
                    if (status) status.textContent = 'Speech recognition not available. Please use Chrome or Edge.';
                    return;
                }
            }
            
            if (!isRecording) {
                startRecording();
            } else {
                stopRecording();
            }
        }
        
        function startRecording() {
            if (!recognition) {
                if (status) status.textContent = 'Speech recognition not initialized. Please reload the page.';
                console.error('Recognition not available');
                return;
            }
            
            if (!micBtn || !status) {
                console.error('Mic button or status element not found');
                return;
            }
            
            try {
                transcript = '';
                recognition.start();
                isRecording = true;
                micBtn.classList.add('recording');
                status.textContent = 'Listening... Speak now!';
                status.classList.add('listening');
                
                // Start audio visualization
                startAudioVisualization();
                
                // Safety timeout - if no results after 30 seconds, remind user
                recognitionTimeout = setTimeout(() => {
                    if (isRecording && transcript.length === 0 && status) {
                        status.textContent = 'Still listening... Make sure your microphone is on';
                    }
                }, 30000);
                
                console.log('Started recording');
            } catch (error) {
                console.error('Error starting recognition:', error);
                
                // If already started, stop and restart
                if (error.message && error.message.includes('already started')) {
                    recognition.stop();
                    setTimeout(() => {
                        startRecording();
                    }, 200);
                } else {
                    // Try to reinitialize
                    isRecording = false;
                    if (micBtn) micBtn.classList.remove('recording');
                    if (status) status.textContent = 'Reinitializing... Click mic again';
                    
                    setTimeout(() => {
                        if (initializeSpeechRecognition()) {
                            setupRecognitionHandlers();
                            if (status) status.textContent = 'Press mic to speak';
                        }
                    }, 500);
                }
            }
        }
        
        function stopRecording() {
            if (!recognition) return;
            
            if (!micBtn || !status) {
                console.error('Mic button or status element not found');
                return;
            }
            
            if (recognitionTimeout) {
                clearTimeout(recognitionTimeout);
                recognitionTimeout = null;
            }
            
            // Stop audio visualization
            stopAudioVisualization();
            
            recognition.stop();
            isRecording = false;
            micBtn.classList.remove('recording');
            status.classList.remove('listening');
            
            if (transcript.trim()) {
                status.textContent = 'Generating preview...';
                generatePreviews(transcript);
            } else {
                status.textContent = 'No speech detected. Try again or click "Login with Google"';
            }
        }
        
        // Audio visualization functions
        function startAudioVisualization() {
            if (!voiceVisualizer || !voiceBars) return;
            
            // Show visualizer
            voiceVisualizer.classList.add('active');
            
            // Get microphone access
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    // Create audio context
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioContext.createAnalyser();
                    microphone = audioContext.createMediaStreamSource(stream);
                    
                    analyser.fftSize = 256;
                    microphone.connect(analyser);
                    
                    // Start animation loop
                    animateVisualizer();
                })
                .catch(err => {
                    console.error('Error accessing microphone:', err);
                    // Continue without visualization if mic access fails
                });
        }
        
        function stopAudioVisualization() {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
            
            if (microphone) {
                microphone.disconnect();
                microphone = null;
            }
            
            if (audioContext && audioContext.state !== 'closed') {
                audioContext.close();
                audioContext = null;
            }
            
            analyser = null;
            
            if (voiceVisualizer) {
                voiceVisualizer.classList.remove('active');
            }
            
            // Reset all bars to minimum height
            if (voiceBars) {
                voiceBars.forEach(bar => {
                    bar.style.height = '4px';
                });
            }
        }
        
        function animateVisualizer() {
            if (!analyser || !voiceBars) return;
            
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);
            
            // Calculate average volume
            let sum = 0;
            for (let i = 0; i < bufferLength; i++) {
                sum += dataArray[i];
            }
            const average = sum / bufferLength;
            
            // Update each bar based on frequency data
            const barCount = voiceBars.length;
            const step = Math.floor(bufferLength / barCount);
            
            voiceBars.forEach((bar, index) => {
                const dataIndex = index * step;
                const value = dataArray[dataIndex] || 0;
                // Map value (0-255) to height (4px to 40px)
                const height = Math.max(4, (value / 255) * 36 + 4);
                bar.style.height = height + 'px';
            });
            
            if (isRecording) {
                animationFrameId = requestAnimationFrame(animateVisualizer);
            }
        }
        
        // Set up recognition event handlers
        function setupRecognitionHandlers() {
            if (!recognition) {
                console.error('Cannot set up handlers: recognition is null');
                return;
            }
            
            console.log('Setting up recognition handlers...');
            
            recognition.onresult = (event) => {
                let interimTranscript = '';
                
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcriptPiece = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        transcript += transcriptPiece + ' ';
                    } else {
                        interimTranscript += transcriptPiece;
                    }
                }
                
                console.log('Recognition result:', transcript, interimTranscript);
                
                if (transcript) {
                    if (status) status.textContent = 'Listening... (Click mic again when done)';
                }
            };
            
            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error, event);
                
                if (!status) return;
                
                // Clear timeout
                if (recognitionTimeout) {
                    clearTimeout(recognitionTimeout);
                    recognitionTimeout = null;
                }
                
                isRecording = false;
                stopAudioVisualization();
                if (micBtn) micBtn.classList.remove('recording');
                status.classList.remove('listening');
                
                // Handle network errors with aggressive retry
                if (event.error === 'network') {
                    if (status) status.textContent = 'Network error. Please check your connection and try again.';
                } else if (event.error === 'no-speech') {
                    status.textContent = 'No speech detected. Click mic to try again!';
                } else if (event.error === 'audio-capture') {
                    status.textContent = 'Microphone not detected. Check connection and try again.';
                } else if (event.error === 'not-allowed') {
                    status.textContent = 'Microphone blocked! Allow access in browser settings.';
                    setTimeout(() => {
                        alert('Microphone Permission Required:\n\n' +
                              '1. Click the lock icon in the address bar\n' +
                              '2. Change microphone setting to "Allow"\n' +
                              '3. Refresh the page (⌘+R or Ctrl+R)\n' +
                              '4. Try clicking the mic button again');
                    }, 500);
                } else if (event.error === 'aborted') {
                    status.textContent = 'Recording stopped. Click mic to start again!';
                } else {
                    status.textContent = `${event.error} - Click mic to retry`;
                }
                
                setTimeout(() => {
                    if (!isRecording && status) {
                        status.textContent = 'Press to speak';
                    }
                }, 4000);
            };
            
            recognition.onend = () => {
                console.log('Recognition ended, isRecording:', isRecording);
                
                // Clear timeout
                if (recognitionTimeout) {
                    clearTimeout(recognitionTimeout);
                    recognitionTimeout = null;
                }
                
                if (isRecording) {
                    // Automatically restart if still in recording mode
                    console.log('Auto-restarting recognition...');
                    setTimeout(() => {
                        try {
                            recognition.start();
                        } catch (error) {
                            console.error('Error restarting recognition:', error);
                            // Try to reinitialize
                            if (initializeSpeechRecognition()) {
                                setupRecognitionHandlers();
                                try {
                                    recognition.start();
                                } catch (e) {
                                    console.error('Failed to restart even after reinit:', e);
                                    isRecording = false;
                                    stopAudioVisualization();
                                    if (micBtn) micBtn.classList.remove('recording');
                                    if (status) {
                                        status.classList.remove('listening');
                                        status.textContent = 'Click mic to start again';
                                    }
                                }
                            }
                        }
                    }, 100);
                } else {
                    // Recording was intentionally stopped
                    stopAudioVisualization();
                    if (micBtn) micBtn.classList.remove('recording');
                    if (status) status.classList.remove('listening');
                }
            };
            
            console.log('Recognition event handlers set up');
        }
        
        // Preview generation and display
        let currentInvoiceData = null;
        let currentContractData = null;
        let currentPreviewType = 'invoice';
        
        async function generatePreviews(transcriptText) {
            const previewPanel = document.getElementById('previewPanel');
            const previewLoading = document.getElementById('previewLoading');
            const previewInvoiceContent = document.getElementById('previewInvoiceContent');
            const previewContractContent = document.getElementById('previewContractContent');
            const previewDownloadBtn = document.getElementById('previewDownloadBtn');
            
            // Show preview panel and loading
            previewPanel.classList.add('active');
            previewLoading.style.display = 'flex';
            previewInvoiceContent.style.display = 'none';
            previewContractContent.style.display = 'none';
            previewDownloadBtn.style.display = 'none';
            
            try {
                // Generate invoice
                const invoiceResponse = await fetch('/api/invoices/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ transcript: transcriptText, userId: null })
                });
                
                if (invoiceResponse.ok) {
                    const invoiceResult = await invoiceResponse.json();
                    // Handle both response formats
                    if (invoiceResult.invoiceData) {
                        currentInvoiceData = { ...invoiceResult.invoiceData, _id: invoiceResult._id || invoiceResult.invoiceId };
                    } else {
                        currentInvoiceData = invoiceResult;
                    }
                    displayInvoicePreview(currentInvoiceData);
                } else {
                    const errorText = await invoiceResponse.text();
                    console.error('Failed to generate invoice:', errorText);
                    previewInvoiceContent.innerHTML = `<p style="color: #ef4444; text-align: center; padding: 2rem;">Error generating invoice: ${errorText}</p>`;
                }
                
                // Generate contract
                const contractResponse = await fetch('/api/contracts/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ transcript: transcriptText, userId: null })
                });
                
                if (contractResponse.ok) {
                    const contractResult = await contractResponse.json();
                    // Handle both response formats
                    if (contractResult.contractData) {
                        currentContractData = { ...contractResult.contractData, _id: contractResult._id || contractResult.contractId };
                    } else {
                        currentContractData = contractResult;
                    }
                    displayContractPreview(currentContractData);
                } else {
                    const errorText = await contractResponse.text();
                    console.error('Failed to generate contract:', errorText);
                    previewContractContent.innerHTML = `<p style="color: #ef4444; text-align: center; padding: 2rem;">Error generating contract: ${errorText}</p>`;
                }
                
                // Hide loading and show content
                previewLoading.style.display = 'none';
                previewInvoiceContent.style.display = 'block';
                previewInvoiceContent.classList.add('active');
                switchPreviewTab('invoice');
                previewDownloadBtn.style.display = 'block';
                status.textContent = 'Preview ready!';
                
            } catch (error) {
                console.error('Error generating previews:', error);
                previewLoading.style.display = 'none';
                previewInvoiceContent.innerHTML = '<p style="color: #ef4444; text-align: center; padding: 2rem;">Error generating preview. Please try again.</p>';
                status.textContent = 'Error generating preview. Please try again.';
            }
        }
        
        function displayInvoicePreview(invoiceData) {
            const previewInvoiceContent = document.getElementById('previewInvoiceContent');
            
            if (!invoiceData) {
                previewInvoiceContent.innerHTML = '<p style="color: #ef4444; text-align: center; padding: 2rem;">No invoice data available</p>';
                return;
            }
            
            console.log('Displaying invoice preview:', invoiceData);
            
            const itemsHtml = (invoiceData.items || []).map(item => `
                <div class="preview-item">
                    <div>${(item.description || 'Service').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</div>
                    <div>${item.quantity || 1}</div>
                    <div>$${Number(item.rate || item.unit_price || 0).toFixed(2)}</div>
                    <div>$${Number(item.amount || item.line_total || 0).toFixed(2)}</div>
                </div>
            `).join('');
            
            previewInvoiceContent.innerHTML = `
                <div class="preview-section">
                    <div class="preview-header">
                        <div>
                            <label class="preview-label">Invoice Number:</label>
                            <input type="text" class="preview-input" value="${invoiceData.invoiceNumber || invoiceData.invoice_number || 'N/A'}" readonly>
                        </div>
                        <div>
                            <label class="preview-label">Date:</label>
                            <input type="date" class="preview-input" value="${invoiceData.date || ''}" readonly>
                        </div>
                        <div>
                            <label class="preview-label">Due Date:</label>
                            <input type="date" class="preview-input" value="${invoiceData.dueDate || invoiceData.due_date || ''}" readonly>
                        </div>
                    </div>
                    
                    <div class="preview-parties">
                        <div class="preview-party">
                            <h3>From:</h3>
                            <input type="text" class="preview-input" value="${(invoiceData.from?.name || 'Your Company')}" readonly>
                            <textarea class="preview-input" rows="2" readonly>${invoiceData.from?.address || ''}</textarea>
                            <input type="text" class="preview-input" value="${invoiceData.from?.phone || ''}" readonly>
                            <input type="email" class="preview-input" value="${invoiceData.from?.email || ''}" readonly>
                        </div>
                        <div class="preview-party">
                            <h3>Bill To:</h3>
                            <input type="text" class="preview-input" value="${invoiceData.to?.name || 'Client'}" readonly>
                            <textarea class="preview-input" rows="2" readonly>${invoiceData.to?.address || ''}</textarea>
                            <input type="text" class="preview-input" value="${invoiceData.to?.phone || ''}" readonly>
                            <input type="email" class="preview-input" value="${invoiceData.to?.email || ''}" readonly>
                        </div>
                    </div>
                    
                    <div class="preview-items">
                        <h3>Items:</h3>
                        ${itemsHtml || '<p style="color: var(--dark-grey); opacity: 0.6;">No items</p>'}
                    </div>
                    
                    <div class="preview-totals">
                        <div class="total-row">
                            <span>Subtotal:</span>
                            <span>$${Number(invoiceData.subtotal || 0).toFixed(2)}</span>
                        </div>
                        <div class="total-row total-final">
                            <span>Total:</span>
                            <span>$${Number(invoiceData.total || 0).toFixed(2)}</span>
                        </div>
                    </div>
                    
                    ${invoiceData.notes ? `
                    <div class="preview-notes">
                        <label class="preview-label">Notes:</label>
                        <textarea class="preview-input" rows="3" readonly>${(invoiceData.notes || '').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</textarea>
                    </div>
                    ` : ''}
                </div>
            `;
        }
        
        function displayContractPreview(contractData) {
            const previewContractContent = document.getElementById('previewContractContent');
            
            if (!contractData) {
                previewContractContent.innerHTML = '<p style="color: #ef4444; text-align: center; padding: 2rem;">No contract data available</p>';
                return;
            }
            
            console.log('Displaying contract preview:', contractData);
            
            previewContractContent.innerHTML = `
                <div class="preview-section">
                    <div class="preview-header">
                        <div>
                            <label class="preview-label">Contract Title:</label>
                            <input type="text" class="preview-input" value="${contractData.contractTitle || contractData.title || 'Contract'}" readonly>
                        </div>
                        <div>
                            <label class="preview-label">Effective Date:</label>
                            <input type="date" class="preview-input" value="${contractData.effectiveDate || contractData.effective_date || ''}" readonly>
                        </div>
                    </div>
                    
                    <div class="preview-parties">
                        <div class="preview-party">
                            <h3>Service Provider:</h3>
                            <input type="text" class="preview-input" value="${(contractData.serviceProvider?.name || contractData.parties?.serviceProvider?.name || 'Service Provider')}" readonly>
                            <textarea class="preview-input" rows="2" readonly>${contractData.serviceProvider?.address || contractData.parties?.serviceProvider?.address || ''}</textarea>
                            <input type="text" class="preview-input" value="${contractData.serviceProvider?.phone || contractData.parties?.serviceProvider?.phone || ''}" readonly>
                            <input type="email" class="preview-input" value="${contractData.serviceProvider?.email || contractData.parties?.serviceProvider?.email || ''}" readonly>
                        </div>
                        <div class="preview-party">
                            <h3>Client:</h3>
                            <input type="text" class="preview-input" value="${contractData.client?.name || contractData.parties?.client?.name || 'Client'}" readonly>
                            <textarea class="preview-input" rows="2" readonly>${contractData.client?.address || contractData.parties?.client?.address || ''}</textarea>
                            <input type="text" class="preview-input" value="${contractData.client?.phone || contractData.parties?.client?.phone || ''}" readonly>
                            <input type="email" class="preview-input" value="${contractData.client?.email || contractData.parties?.client?.email || ''}" readonly>
                        </div>
                    </div>
                    
                    ${contractData.sections && contractData.sections.length > 0 ? `
                    <div class="preview-items">
                        <h3>Sections:</h3>
                        ${contractData.sections.map(section => {
                            const title = (section.title || 'Section').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
                            const content = (section.content || '').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
                            return `
                            <div style="margin-bottom: 1rem; padding: 1rem; background: #f9fafb; border-radius: 8px;">
                                <h4 style="font-size: 0.935rem; color: var(--dark-grey); margin-bottom: 0.5rem; font-weight: 500;">${title}</h4>
                                <p style="font-size: 0.85rem; color: var(--dark-grey); line-height: 1.6; margin: 0;">${content}</p>
                            </div>
                        `;
                        }).join('')}
                    </div>
                    ` : '<p style="color: var(--dark-grey); opacity: 0.6; text-align: center; padding: 2rem;">No sections available</p>'}
                </div>
            `;
        }
        
        function switchPreviewTab(type) {
            currentPreviewType = type;
            const invoiceTab = document.querySelector('.preview-tab[onclick*="invoice"]');
            const contractTab = document.querySelector('.preview-tab[onclick*="contract"]');
            const invoiceContent = document.getElementById('previewInvoiceContent');
            const contractContent = document.getElementById('previewContractContent');
            
            if (type === 'invoice') {
                invoiceTab.classList.add('active');
                contractTab.classList.remove('active');
                invoiceContent.classList.add('active');
                contractContent.classList.remove('active');
                contractContent.style.display = 'none';
                invoiceContent.style.display = 'block';
            } else {
                contractTab.classList.add('active');
                invoiceTab.classList.remove('active');
                contractContent.classList.add('active');
                invoiceContent.classList.remove('active');
                invoiceContent.style.display = 'none';
                contractContent.style.display = 'block';
            }
        }
        
        async function downloadPreview() {
            if (currentPreviewType === 'invoice' && currentInvoiceData && currentInvoiceData._id) {
                window.open(`/api/invoices/${currentInvoiceData._id}/pdf`, '_blank');
            } else if (currentPreviewType === 'contract' && currentContractData && currentContractData._id) {
                window.open(`/api/contracts/${currentContractData._id}/pdf`, '_blank');
            } else {
                alert('Preview not ready yet. Please wait for generation to complete.');
            }
        }
        
    </script>
</body>
</html>
